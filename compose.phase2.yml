name: aep-phase2

services:
  redis-phase2:
    image: redis:7.2.5-alpine@sha256:6aaf3f5e6bc8a592fbfe2cccf19eb36d27c39d12dab4f4b01556b7449e7b1f44
    container_name: aep-phase2-redis72
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - ./redis/phase2.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-n", "15", "PING"]
      interval: 1s
      timeout: 1s
      retries: 30
    restart: unless-stopped

  # The worker-to-Redis network fault surface (PAPER_ROADMAP.md 3.1(2),
  # amendment C3). Workers in a partition run connect to 127.0.0.1:6382 and
  # reach Redis through this proxy; the harness then adds a `timeout` toxic to
  # black-hole the connection -- the interesting partition, because the client
  # is left waiting rather than told, and its lease expires while it waits.
  #
  # The proxy is declared in redis/toxiproxy.json rather than created over the
  # API so that a run cannot silently proceed against a proxy that was never
  # made. It sits in this file rather than a harness-only compose file because
  # the thing being partitioned *from* is defined here, and a partition
  # against a different Redis than the suite uses would prove nothing.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    container_name: aep-phase2-toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      # 8474 is the control API; 6382 is the proxied Redis listener.
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:6382:6382"
    volumes:
      - ./redis/toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      redis-phase2:
        condition: service_healthy
    healthcheck:
      # The image is distroless -- no shell -- so this must be the exec form.
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  redis-data:
