\* EXPECT: pass
\* POSITIVE_ONLY_READBACK: absence is never proof of failure. NOT_APPLIED
\* from such a connector is a NAMED contract violation
\* (connector_contract.py:218-224) routed to PERMANENTLY_AMBIGUOUS rather
\* than to a refutation. AllowedReadback keeps that result reachable in every
\* configuration so the branch is exercised and not merely present.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "POSITIVE_ONLY_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect

PROPERTIES
    P1_VersionMonotone
    P1_NoStatusRegression
    P2_LegalEdgesOnly
    P2_NoReentry
    P2_EventuallyResolved
