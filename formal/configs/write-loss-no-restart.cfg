\* EXPECT: pass
\* WS-4's fault WITHOUT the restart that exposes it: WAITAOF is issued,
\* reports success, and the write is discarded -- but Redis never dies, so
\* nothing is ever read back from the durable prefix and nothing is lost.
\* Every property holds. This is the model's version of WS-4's own framing:
\* the lie costs nothing until the moment it costs everything.
\*
\* It also gives finding F3 a REPRODUCIBLE measurement. This configuration
\* and b3-no-barrier both explore a complete state space, so their counts are
\* deterministic and comparable, where two failing configurations' counts are
\* not -- those depend on which counterexample the search reaches first and
\* vary between runs.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = FALSE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
