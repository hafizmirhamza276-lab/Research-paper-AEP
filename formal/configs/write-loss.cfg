\* EXPECT: fail NoLostEffect
\* WS-4. The barrier is enabled and WAITAOF is really issued; the storage
\* layer reports the fsync succeeded and discards the write anyway
\* (dm-flakey drop_writes). The protocol has no way to tell this from a
\* truthful fsync, which is why the ablation and the fault produce the same
\* model state -- see README section 6, finding F3.
\*
\* SingleTimeline is FALSE here because a lost write is only observable
\* through the restart that exposes it. That is what makes the fault so
\* dangerous: nothing detects the lie until the moment it costs something.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = FALSE
    SingleTimeline       = FALSE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
