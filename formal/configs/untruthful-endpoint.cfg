\* EXPECT: fail NoLostEffect
\* docs/22 section 5.1 and R2-4: provider evidence is trusted without
\* corroboration. FIRED_CONFIRMED and FAILED_CONFIRMED at the runner come
\* from declared evidence with no independent verification, and nothing
\* checks that a connector claiming AUTHORITATIVE_READBACK can really prove
\* absence (R2-5). This is the assumption that carries the headline claim.
\*
\* Both trilemma horns open here, and the CHEAPER one is the lost effect:
\* nine states, in which the endpoint applies the mutation, reports
\* DEFINITIVE_FAILURE, and the runner writes FAILED_CONFIRMED. The duplicate
\* needs the wrong FAILED_CONFIRMED to then reopen the creation fence, which
\* costs more steps, so TLC reaches the lost effect first. The duplicate has
\* its own configuration, untruthful-endpoint-duplicate, because a horn that
\* is merely reachable-in-principle is not evidence.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = FALSE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
