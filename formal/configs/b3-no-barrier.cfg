\* EXPECT: pass
\* B3: the durability barrier ablated, with no Redis restart in the run.
\* experiments/baselines/b3_no_barrier.py -- the same WriteAheadRunner, the
\* same Lua, the same preflight, with NoBarrierDurabilityBarrier in place of
\* the real one. The acknowledgement is still issued and the authorization is
\* still written, so only the WAITAOF round trip is gone.
\*
\* docs/26:211 asks for this configuration explicitly: show P2 holds without
\* the barrier. It does. Every state-machine property survives the ablation,
\* because the barrier does not defend the state machine -- it defends the
\* record's existence, and nothing here destroys records. This is the formal
\* counterpart of b3_no_barrier.py's own warning that a run whose only fault
\* is a graceful restart will show B3 and AEP-full agreeing.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = FALSE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
