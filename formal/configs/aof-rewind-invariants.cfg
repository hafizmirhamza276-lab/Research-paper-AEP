\* EXPECT: pass
\* THE CONFIGURATION THAT CHECKS WHAT SECTION VI-C-1 PRINTS.
\*
\* The manuscript's detection subsection states a matched pair: with the
\* barrier ablated and a restart that replays a shorter log, `no lost effect`
\* fails; with the barrier ENABLED under the same restart, only version
\* monotonicity breaks and `no lost effect` HOLDS. The first half is
\* b3-no-barrier-restart.cfg, which fails at 8 steps. The second half was not
