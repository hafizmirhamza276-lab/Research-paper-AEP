\*
\* Why aof-rewind.cfg does not check it. P1_VersionMonotone is an ACTION
\* property -- `[][store'.version >= store.version]_vars`, AEP.tla:637 -- so
\* TLC evaluates it during state generation and halts on the first violating
\* step, exactly as it does for an invariant. scripts/run_tlc.sh runs TLC
\* without -continue. aof-rewind therefore stops at P1's 4-step counterexample
\* with states still on the queue, and never reaches the depth at which the
\* barrier-off NoLostEffect counterexample lives (8). The invariants are listed
\* in that file and are not refuted there; they are simply not exhausted.
\*
\* So this file is aof-rewind.cfg with the PROPERTIES block removed and
\* nothing else changed. Same constants, same barrier enabled, same
\* SingleTimeline = FALSE. With no temporal or action property to stop it, TLC
\* explores the whole bounded state space and checks every invariant over it.
\* A pass here is the evidence for the manuscript's `no lost effect holds`.
\*
\* The pair to read it against is b3-no-barrier-restart.cfg, which differs
