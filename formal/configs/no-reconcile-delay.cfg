\* EXPECT: fail NoLostEffect
\* The F5 scheduling gap the design already declares
\* (docs/06-phase2-design.md:249-252): a window remains between a successful
\* preflight and transmission. Recovery may then classify an intent whose
\* worker is still about to dispatch, read back NOT_APPLIED truthfully,
\* record FAILED_CONFIRMED -- and the dispatch lands afterwards.
\*
\* In the implementation the defence is a wall-clock one: reconcile_after is
\* set to prepared_at + client_timeout + buffer_margin + settlement_lag
\* (aep_core/core/intents.py:836-841) so eligibility cannot arrive inside the
\* dispatch window. That is a real-time argument, and this untimed model
\* cannot discharge it -- it can only show what its absence costs.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = FALSE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
