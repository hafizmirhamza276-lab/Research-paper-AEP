\* EXPECT: pass
\* The weakest endpoint the contract admits: it cannot be queried at all.
\* Every unresolved intent escalates to PERMANENTLY_AMBIGUOUS with no query
\* (aep_core/core/intent_recovery.py:424-437) -- one of the two bold rows of
\* the classification table, where declared ambiguity is produced by design
\* rather than by failure.
\*
\* This is the configuration that matters most for the paper's framing. The
\* endpoint supplies nothing, can be enrolled in nothing, and answers no
\* questions -- and the trilemma invariants still hold, because the protocol
\* takes the third horn every time.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "NO_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect

PROPERTIES
    P1_VersionMonotone
    P1_NoStatusRegression
    P2_LegalEdgesOnly
    P2_NoReentry
    P2_EventuallyResolved
