\* EXPECT: fail NoDurableIntentExists
\* The same witness for the barrier ablation, whose durable prefix advances
\* only on the background flush -- so without this, b3-no-barrier's liveness
\* result could be passing vacuously for precisely the reason the ablation is
\* interesting.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = FALSE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    NoDurableIntentExists
