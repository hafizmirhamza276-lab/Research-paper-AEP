\* EXPECT: fail NoLostEffect
\* B3 with the AOF rewind enabled: the same ablation, now in a run where
\* Redis dies without flushing. This is the pairing that gives the barrier
\* its purpose, and the difference from b3-no-barrier is the whole point of
\* the ablation.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = FALSE
    TruthfulFsync        = TRUE
    SingleTimeline       = FALSE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
