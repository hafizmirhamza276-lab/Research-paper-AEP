\* EXPECT: fail NoDurableIntentExists
\* NOT a property of the protocol. P2_EventuallyResolved is an implication,
\* so it passes trivially wherever a durable ABOUT_TO_FIRE is unreachable.
\* This configuration checks an invariant that must BREAK, and its
\* counterexample is the witness that the antecedent is reachable -- so the
\* liveness result in `base` is about something rather than about nothing.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    NoDurableIntentExists
