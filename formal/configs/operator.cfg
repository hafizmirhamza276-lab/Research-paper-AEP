\* EXPECT: fail NoLostEffect
\* docs/22 section 5.3: the operator is UNAUTHENTICATED. `actor` is validated
\* only as a bounded safe identifier, so any caller holding the lease and the
\* current version can drive PERMANENTLY_AMBIGUOUS -> FAILED_CONFIRMED and
\* re-enable new attempts.
\*
\* The counterexample is not a defect in the protocol: it is the protocol
\* doing what an operator told it. It is here because the paper's safety
\* claims are claims about the AUTOMATED outcome, and this run is what fixes
\* the boundary of that word. Declared ambiguity is only durable if nobody
\* overrides it.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = TRUE
    ReconcileDelayCovers = TRUE

INVARIANTS
    TypeOK
    P2_AtMostOneUnresolved
    P3_BoundedAttempts
    NoUndetectedDuplicate
    NoLostEffect
