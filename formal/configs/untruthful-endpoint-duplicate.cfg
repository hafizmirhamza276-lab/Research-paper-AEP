\* EXPECT: fail NoUndetectedDuplicate
\* The trilemma's FIRST horn, isolated. Same untruthful endpoint; only
\* NoUndetectedDuplicate is checked, so the cheaper lost-effect violation
\* cannot preempt it and the duplicate has to be reached on its own.
\*
\* The path is the one the creation fence exists to prevent: a wrong
\* FAILED_CONFIRMED is the only thing that reopens it
\* (aep_core/core/intents.py:507-509), a second intent is minted, a second
\* effect follows, and the ledger reports one. AEP cannot detect this,
\* because detecting it would require the endpoint to be truthful about the
\* thing it was untruthful about.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 5
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = TRUE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = FALSE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

INVARIANTS
    NoUndetectedDuplicate
