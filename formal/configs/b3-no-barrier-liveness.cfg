\* EXPECT: pass
\* The barrier ablation's LIVENESS half, at a reduced version bound.
\* b3-no-barrier checks safety at MaxVersion 5, where the state space is
\* 182,056 distinct states -- roughly six times the base configuration's
\* 31,484, because without a barrier the durable prefix advances only on the
\* background flush and so lags by an arbitrary amount. Liveness checking
\* over that graph did not finish inside 40 minutes.
\*
\* Splitting it is a cost decision and it is recorded rather than absorbed:
\* the ablation's liveness is checked one version shallower than its safety.
\* See README section 4.3.
\*
SPECIFICATION FairSpec

CONSTANTS
    Workers              = {w1, w2}
    IntentIds            = {i1, i2}
    MaxVersion           = 4
    MaxAttempts          = 2
    Capability           = "AUTHORITATIVE_READBACK"
    BarrierEnabled       = FALSE
    TruthfulFsync        = TRUE
    SingleTimeline       = TRUE
    TruthfulEndpoint     = TRUE
    OperatorEnabled      = FALSE
    ReconcileDelayCovers = TRUE

PROPERTIES
    P1_VersionMonotone
    P1_NoStatusRegression
    P2_LegalEdgesOnly
    P2_NoReentry
    P2_EventuallyResolved
