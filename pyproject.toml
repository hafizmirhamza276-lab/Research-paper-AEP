[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aep-core"
version = "0.2.0"
description = "Agent Execution Protocol — fail-closed execution for agents calling non-idempotent legacy APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Upper-bounded on purpose: the artifact is evidenced on CPython 3.13 only
# (see .python-version and docs/23-ci-hardening-report.md). Widening this is a
# claim that must be re-evidenced, not a convenience.
requires-python = ">=3.13,<3.14"
dependencies = [
    "redis>=5.0",
    "pydantic>=2.0",
    "cryptography>=46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.20",
    # tests/test_artifact_reproducibility.py parses .github/workflows/ci.yml
    # structurally (per job) rather than by substring, so a gate can assert
    # "every job that runs the suite provisions Redis from compose" instead of
    # "the file contains the word compose somewhere".
    "pyyaml>=6.0",
]
cov = [
    "pytest-cov>=7.0",
]
# The Phase 2B evaluation harness (PAPER_ROADMAP.md section 3). Separated from
# `dev` because aep_core itself must never import any of it: the protocol under
# measurement cannot depend on the thing measuring it.
experiments = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aep_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# One suite, one set of gates. The harness tests live next to the harness
# (experiments/mock_api/tests) rather than in tests/, but they are collected by
# the same pytest invocation so the zero-skip / zero-xpass gates in
# scripts/check_pytest_gates.py cover them too.
testpaths = ["tests", "experiments"]
# An xfail that starts passing is a result change nobody reviewed. Making it
# a hard failure means it cannot reach the CI gate as a mere summary note.
# scripts/check_pytest_gates.py checks it independently, because a per-test
# strict=False can override this global setting.
xfail_strict = true
markers = [
    "redis72_integration: requires the dedicated Redis 7.2+ AOF DB 15 environment",
]

[tool.coverage.run]
source = ["aep_core"]
branch = false

[tool.coverage.report]
# The roadmap's artifact-evaluation gate (PAPER_ROADMAP.md:83).
fail_under = 90
show_missing = true
