[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aep-core"
version = "0.1.0"
description = "Agent Execution Protocol — Phase 1 core persistence and concurrency primitives"
requires-python = ">=3.13"
dependencies = [
    "redis>=5.0",
    "pydantic>=2.0",
    "cryptography>=46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aep_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "redis72_integration: requires the dedicated Redis 7.2+ AOF DB 15 environment",
]
