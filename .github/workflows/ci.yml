name: CI

# Artifact-evaluation CI for AEP (PAPER_ROADMAP.md section 2, Phase 2A).
#
# The design constraint driving this file: **a green build must mean the suite
# ran**. The repository's audit history contains a green build whose green came
# from tests that never executed ("36 skipped = green"). Every gate below
# exists to make that specific outcome impossible, and each gate is itself
# tested in tests/test_ci_gates.py and tests/test_citation_validator.py.
#
# Gates:
#   (i)   zero skipped tests            -- scripts/check_pytest_gates.py
#   (ii)  zero xpassed tests            -- scripts/check_pytest_gates.py + xfail_strict
#   (iii) coverage >= 90% on aep_core   -- pytest-cov --cov-fail-under
#   (iv)  docs/22 citations in range    -- scripts/validate_citations.py
#
# Redis is never faked here. Both test jobs start Redis from
# compose.phase2.yml -- the same definition developers run locally -- and then
# assert, before running anything, that the live server really provides
# redis/phase2.conf semantics and really implements WAITAOF
# (scripts/verify_redis_semantics.py, deliberately without --apply: a server
# that needs settings applied at runtime is a broken compose file, not a
# fixable one).
#
# Nothing is deselected. An earlier revision took Redis for the main job from
# a GitHub `services:` container, which starts before checkout and so can
# neither mount redis/phase2.conf nor survive `docker restart` with AOF
# intact; that forced the crash-recovery test to be deselected by name.
# Deselection was the only construct here capable of turning a gate green
# without the work being done (docs/23-ci-hardening-report.md G1), so it is
# gone, and tests/test_artifact_reproducibility.py fails the suite if it
# returns.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The exact image the verified runs used. Pinned by digest, not tag: a tag
  # can be re-pointed, and "Redis 7.2 with AOF" is load-bearing for every
  # durability claim in docs/22-formal-model.md.
  REDIS_IMAGE: redis:7.2.5-alpine@sha256:6aaf3f5e6bc8a592fbfe2cccf19eb36d27c39d12dab4f4b01556b7449e7b1f44
  # Guards against a collapsed collection reading as success. Raise this when
  # the suite grows; never lower it without saying why.
  # 1223 (Phase 2A) -> 1387 with the Phase 2B Session 1 harness tests
  #                 -> 1565 with the Session 2 crash injector and runner
  #                 -> 1624 with the Session 3 baselines, statistics and analysis.
  #                 -> 1700 with Phase 4B's write-loss probe and the
  #                    manuscript number-generator tests (1721 collected).
  MINIMUM_TESTS: "1700"

jobs:
  # =========================================================================
  # Gate (iv). No services, so it reports fast and independently of Redis.
  # =========================================================================
  citations:
    name: Citation ranges (docs/22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --extra cov

      - name: Validate docs/22-formal-model.md citations
        run: uv run --frozen python scripts/validate_citations.py

  # =========================================================================
  # Main suite. Redis 7.2 from compose.phase2.yml, so redis/phase2.conf is
  # mounted rather than re-applied, and so `docker restart` brings the server
  # back with AOF on and the appendonly data intact -- which is what lets the
  # crash-recovery test run here instead of being deselected.
  # =========================================================================
  test:
    name: Suite (py${{ matrix.python-version }}, Redis from compose)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    env:
      REDIS_URL: redis://127.0.0.1:6381/15
      AEP_PHASE2_REDIS_INTEGRATION: "1"
      # tests/test_phase2_waitaof_integration.py restarts this container by
      # name. It must be the container_name in compose.phase2.yml.
      AEP_PHASE2_REDIS_CONTAINER: aep-phase2-redis72

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        # `experiments` is required: pytest collects experiments/ (testpaths in
        # pyproject.toml), and those tests import fastapi/httpx/pyyaml. Without
        # it the harness tests fail to import -- which is a collection error,
        # not a skip, but the suite would still stop describing what it claims.
        # `analysis` likewise: experiments/analyze.py imports matplotlib, and
        # its tests are collected by the same invocation.
        run: >-
          uv sync --frozen --extra dev --extra cov --extra experiments
          --extra analysis

      - name: Start Redis 7.2 from compose.phase2.yml
        run: |
          docker compose -f compose.phase2.yml up -d --wait
          docker compose -f compose.phase2.yml ps

      - name: Record the exact environment under test
        run: |
          echo "--- interpreter ---"
          uv run --frozen python -VV
          echo "--- resolved dependency set ---"
          uv pip freeze
          echo "--- redis image ---"
          docker image inspect "${REDIS_IMAGE}" --format '{{index .RepoDigests 0}}' || true

      - name: Verify redis/phase2.conf semantics
        # No --apply. This server was started from the config file, so if the
        # settings are not already correct that is a defect in the compose
        # definition and the job must fail rather than repair it in place.
        run: |
          uv run --frozen python scripts/verify_redis_semantics.py \
            --url "${REDIS_URL}"

      - name: Run the suite
        run: |
          set -o pipefail
          uv run --frozen pytest \
            -q -ra --strict-markers \
            --junitxml=junit.xml \
            --cov=aep_core \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            2>&1 | tee pytest-output.txt

      - name: Gate -- zero skipped, zero xpassed, suite actually ran
        if: always()
        run: |
          uv run --frozen python scripts/check_pytest_gates.py \
            --junit junit.xml \
            --output pytest-output.txt \
            --minimum-tests "${MINIMUM_TESTS}"

      - name: Confirm AOF survived the restart test
        # The suite restarted this container. If it came back without AOF the
        # durability evidence collected after that point would be worthless.
        if: always()
        run: |
          uv run --frozen python scripts/verify_redis_semantics.py \
            --url "${REDIS_URL}"

      - name: Tear down
        if: always()
        run: docker compose -f compose.phase2.yml down -v

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            pytest-output.txt
          if-no-files-found: warn

  # =========================================================================
  # The durability suite in isolation, on its own fresh Redis.
  #
  # This job no longer exists to hold a test the main job cannot run -- the
  # main job runs the whole suite now. It exists because running the WAITAOF
  # file alone, against a server nothing else has touched, is a different
  # experiment: it proves the durability tests do not depend on state left
  # behind by the 1200 tests that precede them in the full run, and it fails
  # loudly if they do.
  # =========================================================================
  waitaof-durability:
    name: WAITAOF durability (compose, phase2.conf)
    runs-on: ubuntu-24.04

    env:
      REDIS_URL: redis://127.0.0.1:6381/15
      AEP_PHASE2_REDIS_INTEGRATION: "1"
      AEP_PHASE2_REDIS_CONTAINER: aep-phase2-redis72

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --extra cov

      - name: Start Redis 7.2 from compose.phase2.yml
        run: |
          docker compose -f compose.phase2.yml up -d --wait
          docker compose -f compose.phase2.yml ps

      - name: Verify redis/phase2.conf semantics
        # No --apply: this Redis was started from the config file, so if the
        # settings are not already correct that is a real defect in the
        # compose definition and the job should fail.
        run: |
          uv run --frozen python scripts/verify_redis_semantics.py \
            --url "${REDIS_URL}"

      - name: Run the WAITAOF integration suite
        run: |
          set -o pipefail
          uv run --frozen pytest \
            -q -ra --strict-markers \
            tests/test_phase2_waitaof_integration.py \
            --junitxml=junit-waitaof.xml \
            2>&1 | tee pytest-waitaof.txt

      - name: Gate -- zero skipped, zero xpassed
        if: always()
        run: |
          uv run --frozen python scripts/check_pytest_gates.py \
            --junit junit-waitaof.xml \
            --output pytest-waitaof.txt \
            --minimum-tests 1

      - name: Confirm AOF survived the restart test
        if: always()
        run: |
          uv run --frozen python scripts/verify_redis_semantics.py \
            --url "${REDIS_URL}"

      - name: Tear down
        if: always()
        run: docker compose -f compose.phase2.yml down -v

      - name: Upload WAITAOF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-waitaof
          path: |
            junit-waitaof.xml
            pytest-waitaof.txt
          if-no-files-found: warn

  # =========================================================================
  # Gate (v). The manuscript against the results it claims to report.
  #
  # scripts/check_paper_numbers.py re-derives every generated table and scalar
  # from the frozen CSVs and diffs them against what is committed, so a number
  # cannot quietly survive a change to the CSV under it. Until Phase P it had
  # never run anywhere but the author's machine: experiments/results/ is
  # ignored by design, so a checkout did not contain the CSVs the gate reads.
  # Phase 5A recorded that as the one checklist item it could not discharge
  # (reports/phase-report-5a-2026-08-10.md section D item 5). The gate's inputs
  # are now tracked by name -- see the tail of .gitignore -- and this job is
  # the other half: it makes the gate's verdict a property of the repository
  # rather than of one laptop.
  #
  # Two of the gate's inputs are not tracked and must not be: main.bbl and
  # main.log are LaTeX build products (.gitignore:98,100). They are *derived*
  # from tracked sources, so this job builds the manuscript first rather than
  # committing them. That is also what makes the two checks reading them --
  # "no empty bibliography entries" and "no undefined references" -- mean
  # anything here: they inspect a bibliography and a log this job just
  # produced, not ones an author uploaded.
  #
  # No Redis and no services: this job reads CSVs and runs pdflatex.
  # =========================================================================
  paper-numbers:
    name: Numbers gate (manuscript vs frozen CSVs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync locked environment
        # The state-machine check imports the implementation, so the project
        # itself has to be installed. No extras: the gate reads CSVs and
        # regenerates .tex, and pulls in nothing else.
        run: uv sync --frozen

      - name: Install TeX Live
        # Exactly the set that builds this manuscript, verified against the
        # measurement host: IEEEtran lives in texlive-publishers, cleveref and
        # multirow in texlive-latex-extra, tikz/pgf in texlive-pictures.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-base \
            texlive-bibtex-extra \
            texlive-binaries \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-publishers

      - name: Build the manuscript
        # The committed build recipe, not a re-spelling of it here. It fails
        # on a blank bibliography and on undefined references, both of which
        # LaTeX itself reports as warnings while exiting 0.
        run: bash scripts/build_paper.sh

      - name: Gate -- the manuscript's numbers against the frozen CSVs
        # build_paper.sh ends by running this too. It is repeated as its own
        # step so the verdict is a named, separately-reported result rather
        # than the tail of a build log -- and so that a later edit to the
        # build script cannot quietly remove the check.
        run: uv run --frozen python scripts/check_paper_numbers.py

      - name: Upload the built PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/main.pdf
          if-no-files-found: warn
