# Identical to redis/phase2.conf except for `appendfsync`.
#
# Amendment F0(iii): the durability barrier's latency is a property of the
# fsync policy, not of the protocol, and the paper should say so with a
# measurement rather than an argument. This is the second point on that curve.
#
# It lives in the repository rather than being written to /tmp by the
# benchmark script because a bind mount from the WSL distro's /tmp does not
# reach Docker Desktop's VM: the container started, ignored the missing file,
# and came up with the compiled-in defaults (`appendfsync everysec`,
# `appendonly no`). The benchmark's config gate caught it -- see
# reports/raw/f0iii-appendfsync-always.txt -- but the lesson is that the
# config under test belongs beside the one it is being compared against.
bind 0.0.0.0
protected-mode no
port 6379
databases 16

dir /data
save ""

appendonly yes
appendfsync always
appenddirname appendonlydir
aof-use-rdb-preamble yes
